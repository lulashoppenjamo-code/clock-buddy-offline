<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#db2777" />
<title>Sin conexión — Reloj Checador</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #fdf2f8; color: #831843;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #9d174d; margin: 0 0 24px; max-width: 320px; line-height: 1.45; }
  button {
    background: #db2777; color: #fff; border: none; border-radius: 10px;
    padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .hint { margin-top: 20px; font-size: 12px; color: #be185d; max-width: 300px; }
</style>
</head>
<body>
  <div class="wrap">
    <div style="font-size:48px;margin-bottom:16px">⏰</div>
    <h1>Sin conexión</h1>
    <p>
      No se pudo cargar esta pantalla. Si ya usaste el checador antes,
      volvé a intentar: el esqueleto y los datos locales pueden seguir disponibles.
    </p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <p class="hint">Abrí la app al menos una vez con internet para que se descargue en el dispositivo.</p>
  </div>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
